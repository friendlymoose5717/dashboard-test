<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Hive Account Health Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- 🔐 TOP BAR -->
<div id="topBar">
    <input id="loginUserInput" type="text" placeholder="Hive username…">

    <button id="kcLoginBtn" class="kc-btn">Keychain Login</button>

    <span id="loginStatus"></span>

    <button id="logoutBtn" class="logout-btn hidden">Logout</button>

    <span id="settingsBtn" class="settings-icon">⚙️</span>
</div>

<!-- ⚙️ SETTINGS PANEL -->
<div id="settingsPanel" class="hidden">
    <div class="settings-header">
        <h3>Dashboard Settings</h3>
        <span id="closeSettings" class="close-btn">✖</span>
    </div>

    <div id="settingsContent"></div>

    <!-- Downvote thresholds -->
    <div style="margin-top:20px; padding-top:10px; border-top:1px solid #1a2438;">
        <strong>Incoming Downvotes Thresholds</strong>

        <div style="margin-top:10px; display:flex; align-items:center; gap:10px;">
            <span style="width:14px; height:14px; background:#f59e0b; border-radius:50%; display:inline-block;"></span>
            <span>Warning: > 0 downvotes</span>
        </div>

        <div style="margin-top:6px; display:flex; align-items:center; gap:10px;">
            <span style="width:14px; height:14px; background:#ef4444; border-radius:50%; display:inline-block;"></span>
            <span>Danger: ≥ 10 downvotes</span>
        </div>
    </div>

    <button id="savePrefsBtn" class="save-btn">Save</button>
</div>

<div class="container">

    <div class="header">
        <img src="https://developers.hive.io/images/logotype_black.svg">
        <h1>Hive Account Health Dashboard</h1>
    </div>

    <div>
        <input id="username" placeholder="username" />
        <button id="checkBtn">Check</button>
    </div>

    <div id="dashboard"></div>

</div>

<footer style="margin-top:40px; text-align:center; opacity:0.85; font-size:0.9rem;">

    <img src="https://files.peakd.com/file/peakd-hive/friendlymoose/avatar.png"
         alt="Friendlymoose avatar"
         style="width:40px; height:40px; border-radius:50%; display:block; margin:0 auto 6px auto;">

    <div style="margin-bottom:6px;">
        Created by 
        <a href="https://peakd.com/@friendlymoose"
           target="_blank"
           style="color:#e5e7eb; text-decoration:underline;">
           Friendlymoose
        </a>
    </div>

    <a href="https://discord.gg/txTGEH5zr4"
       target="_blank"
       style="
           display:inline-flex;
           align-items:center;
           gap:6px;
           text-decoration:none;
           color:#7289da;
           font-weight:bold;
       ">
        <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/discord.svg"
             alt="Discord"
             style="width:20px; height:20px; filter:invert(60%) sepia(20%) saturate(800%) hue-rotate(200deg);">
        Questions or suggestions? Join our Discord!
    </a>

</footer>

<script src="app.js" defer></script>

</body>
</html>
